services:
  backend:
    build: ./backend
    ports:
      - "5001:3000"   # avoid conflict with frontend
    environment:
      - MONGODB_URL=mongodb://mongo:27017/skilllink
      - JWT_SECRET=yourSecretHere
    depends_on:
      - mongo

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
    depends_on:
      - mongo

volumes:
  mongo-data:
