<!--
  Environment Variable Injection Script
  This script injects environment variables into the page
  Include this before other scripts in your HTML files
-->
<script>
  // Production environment variables
  // These should be injected by your deployment platform or build process
  window.env = window.env || {
    VITE_API_URL: '/api', // Relative URL for same-domain deployment
    VITE_SOCKET_URL: window.location.origin,
    VITE_APP_NAME: 'Skill Link',
    VITE_APP_VERSION: '1.0.0',
    VITE_DEBUG: 'false',
    VITE_ENABLE_ERROR_REPORTING: 'true',
    VITE_ENABLE_ANALYTICS: 'false',
    NODE_ENV: 'production'
  };
  
  // Override with actual environment variables if available
  // This allows deployment platforms to inject vars at runtime
  if (typeof process !== 'undefined' && process.env) {
    Object.keys(process.env).forEach(key => {
      if (key.startsWith('VITE_')) {
        window.env[key] = process.env[key];
      }
    });
  }
</script>
